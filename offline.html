<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#5b2d82">
    <title>You're offline | Archdiocese of Kota Kinabalu</title>
    <style>
        :root { --ink: #2a1640; --muted: #6b6878; --bg: #f8f4ec; --card: #fff; --line: #ece6f2; }
        @media (prefers-color-scheme: dark) { :root { --ink: #ece4f5; --muted: #a9a3b6; --bg: #15111d; --card: #1d1724; --line: #323245; } }
        * { box-sizing: border-box; }
        body { display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 24px 16px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); background: var(--bg); }
        .card { width: 100%; max-width: 380px; padding: 30px 24px 26px; text-align: center; background: var(--card); border: 1px solid var(--line); border-top: 4px solid #d4a72c; border-radius: 20px; box-shadow: 0 18px 40px rgba(30, 20, 50, .1); }
        .logo { width: 76px; height: 76px; padding: 8px; background: #fff; border-radius: 50%; box-shadow: 0 6px 16px rgba(58, 9, 86, .15); }
        h1 { margin: 16px 0 6px; font: 700 22px Georgia, 'Noto Serif', serif; }
        p { margin: 0 0 20px; font-size: 14.5px; line-height: 1.6; color: var(--muted); }
        button { padding: 12px 26px; font: 600 15px system-ui, sans-serif; color: #fff; background: #4a0d6e; border: 0; border-radius: 999px; cursor: pointer; }
        button:hover, button:focus-visible { background: #5b2d82; }
        small { display: block; margin-top: 16px; font-size: 12px; color: var(--muted); }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="assets/images/logo.png" alt="">
        <h1>You&rsquo;re offline</h1>
        <p>There&rsquo;s no internet connection right now. Mass times, events and your registrations will be back as soon as you&rsquo;re connected.</p>
        <button type="button" onclick="location.reload()">Try again</button>
        <small>Archdiocese of Kota Kinabalu</small>
    </main>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
